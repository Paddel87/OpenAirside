# cargo-deny configuration of OpenAirside (roadmap step 2.1, ADR-018).
# Licence policy from docs/project-context.md section 6: MIT, BSD, Apache-2.0, ISC,
# zlib, MPL-2.0, Unicode-3.0, BlueOak-1.0.0, 0BSD, Python-2.0, WTFPL allowed (ADR-019);
# GPL, AGPL and proprietary licences excluded.

[graph]
all-features = true

[advisories]
# Every advisory fails the check; exceptions need a roadmap reference.
ignore = []

[licenses]
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BlueOak-1.0.0",
    "0BSD",
    "Python-2.0",
    "WTFPL",
]
confidence-threshold = 0.9
# The list is policy, not inventory: unused entries are expected.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# Named exceptions of the warning stock (project-context.md section 7).
skip = [
  # syn 2 only via ts-rs-macros 12.0.1 behind the core feature `ts` (ADR-022); serde uses syn 3.
  # Re-check with every Q.1 whether ts-rs has moved to syn 3.
  { crate = "syn@2.0.119", reason = "ts-rs-macros 12.0.1 still depends on syn 2 (Q.1)" },
  # miniz_oxide 0.8 only via png 0.18.1 in the build tool tools/assets (ADR-033); the save game uses 0.9.
  # Re-check with every Q.1 whether png has moved to miniz_oxide 0.9.
  { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1 still depends on miniz_oxide 0.8 (Q.1)" },
]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
