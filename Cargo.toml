# Cargo workspace of OpenAirside (roadmap step 2.1, ADR-018).
# core/   simulation core, free of any binding code (rule 006)
# bridge/ napi-rs binding for the Electron utility process (ADR-009)
# tools/assets/ build tool for the graphics pipeline, not shipped (ADR-033)
# Spikes keep their own workspaces and are not part of this one.
[workspace]
resolver = "3"
members = ["core", "bridge", "tools/assets"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Paddel87/OpenAirside"
publish = false

# Versions per docs/project-context.md section 3 (verified 2026-10-13).
[workspace.dependencies]
openairside-core = { path = "core" }
napi = { version = "=3.12.7", default-features = false, features = ["napi10", "serde-json"] }
napi-derive = "=3.6.12"
napi-build = "=2.4.4"
serde = { version = "=1.0.229", features = ["derive"] }
rayon = "=1.12.0"
ts-rs = "=12.0.1"
# Bridge: conversion JS ↔ Rust with napi `serde-json` (ADR-024, verified 2026-10-14);
# core: data pack loader (ADR-025).
serde_json = "=1.0.151"
# Data pack loader (ADR-025, verified 2026-10-18): JSON path in errors, versions and ranges.
serde_path_to_error = "=0.1.20"
semver = "=1.0.28"
# JSON Schema files of the data packs, only behind the core feature `schema` (ADR-025).
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
# Save games (ADR-027, verified 2026-10-19): world state with postcard, world section packed
# with Deflate; the file checksum is FNV-1a 64 from core/src/hash.rs.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
miniz_oxide = "=0.9.1"
# SVG rasteriser of the graphics pipeline, build tool only (ADR-033, verified 2026-10-19).
# Without default features: no text, no fonts, no raster images inside SVG.
resvg = { version = "=0.48.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# `unsafe` only with a `// SAFETY:` comment (project-context.md section 6).
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
