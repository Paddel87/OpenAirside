<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAirside</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="root"></main>
    <aside id="debug">
      <pre id="hud"></pre>
      <div id="log"></div>
      <form id="console" autocomplete="off">
        <input id="console-input" placeholder="help" spellcheck="false" />
      </form>
    </aside>
    <aside id="saves" hidden></aside>
    <aside id="notice" hidden></aside>
    <aside id="settings" hidden></aside>
    <button id="settings-button" type="button"></button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
