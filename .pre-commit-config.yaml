# Pre-Commit-Konfiguration für OpenAirside. Abgeleitet aus templates/pre-commit/typescript.yaml,
# ergänzt um Markdown (aus dem Template-Repo) und Rust-Hooks (keine Rust-Vorlage vorhanden).
# Framework: pre-commit (project-context.md Abschnitt 7, ADR-002).
# Installation: `pip install pre-commit && pre-commit install`
# Lokal ausführen: `pre-commit run --all-files`
#
# Die lokalen Code-Hooks (language: system) greifen nur, wenn passende Dateien geändert werden;
# sie setzen ab Fahrplan-Schritt 2.1 installierte Abhängigkeiten voraus (npm ci, rustup).
# Versionen geprüft am 2026-10-13: pre-commit-hooks v6.0.0 (2025-08-09, Linie ohne Patches,
# über ein Jahr alt), markdownlint-cli2 v0.23.3 (Linie 0.23 seit 2026-07).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      # Prettier über die Projekt-Version aus package.json (3.9.10); Markdown ist per .prettierignore ausgenommen.
      - id: prettier
        name: Prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]

      - id: eslint
        name: ESLint
        entry: npx --no-install eslint --max-warnings 0 --report-unused-disable-directives --no-warn-ignored
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: tsc
        name: TypeScript type-check
        entry: npx --no-install tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: vitest-related
        name: Vitest (related tests)
        entry: npx --no-install vitest related --run
        language: system
        types_or: [ts, tsx]
        pass_filenames: true

      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
