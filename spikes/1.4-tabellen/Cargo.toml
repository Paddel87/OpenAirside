# Spike for roadmap step 1.4 (large table panel next to the playfield). Throwaway code.
# Reuses the bridge from spike 1.3 (simulation thread, S-1, S-2) unchanged and adds
# `panel-core`, a synthetic flight table encoded column by column for the panel.
[workspace]
resolver = "3"
members = ["panel-core", "sim-bridge"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
