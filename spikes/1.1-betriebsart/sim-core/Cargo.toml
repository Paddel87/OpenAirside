[package]
name = "sim-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
# Multi-core stepping via rayon (native builds only).
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "=1.12.0", optional = true }

[[bin]]
name = "bench"
required-features = ["parallel"]
