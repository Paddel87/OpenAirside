[package]
name = "sim-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sim-core = { path = "../sim-core" }
rayon = "=1.12.0"
napi = { version = "=3.12.7", default-features = false, features = ["napi10"] }
napi-derive = "=3.6.8"

[build-dependencies]
napi-build = "=2.4.4"
