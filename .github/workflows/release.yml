# Release-Builds für OpenAirside (Klasse G, Aufteilung nach templates/projektstart.md Schritt 10).
# Trigger: Tag v* (z. B. v0.1.0) legt einen Release-ENTWURF an; veröffentlicht wird von Hand nach
# Freigabe. Manuell startbar (workflow_dispatch) für Testpakete ohne Entwurf (ADR-018).
# Pakete: Windows NSIS x64, Linux AppImage und deb x64, macOS dmg arm64 (ADR-012) mit
# Ad-hoc-Signatur (ADR-015); arm64 für Windows und Linux folgt in 7.2.
# Änderungen an dieser Datei sind freigabepflichtig (CLAUDE.md 4.7).
# Vor dem ersten öffentlichen Release gilt das Gate aus Fahrplan-Schritt 7.1.
# Zusätzliche Action geprüft am 2026-10-13: download-artifact v8.0.2 (Linie 8.0 seit 2026-02).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "26.11.1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            exe: release/win-unpacked/OpenAirside.exe
          - os: ubuntu-latest
            target: dist:linux
            exe: release/linux-unpacked/openairside
          - os: macos-latest
            target: dist:mac
            exe: release/mac-arm64/OpenAirside.app/Contents/MacOS/OpenAirside
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
      - name: Paket bauen (ohne Beglaubigung, siehe project-context.md Abschnitt 8)
        run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Signatur prüfen (macOS, ad hoc, ADR-015)
        if: runner.os == 'macOS'
        run: |
          app="release/mac-arm64/OpenAirside.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee codesign.txt
          grep -q "Signature=adhoc" codesign.txt
          codesign --verify --verbose=2 "$app/Contents/Resources/app/app/native/openairside-bridge.node"
      - name: Rauchtest des Pakets (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          OPENAIRSIDE_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.exe }}
      - name: Rauchtest des Pakets
        if: runner.os != 'Linux'
        shell: bash
        run: npm run test:e2e
        env:
          OPENAIRSIDE_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.exe }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openairside-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          retention-days: 14

  draft:
    name: Release-Entwurf anlegen
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Entwurf mit allen Paketen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "OpenAirside $GITHUB_REF_NAME" artifacts/*/*
