# Testprogramm Spike 1.5 für Windows, macOS und Linux (Fahrplan-Schritt 1.5, ERKUNDUNG).
# Baut spikes/1.5-leistung/app (Spielfeld aus 1.3, Panel aus 1.4, Langzeitlauf des
# Fünf-Etagen-Referenzszenarios bei höchster Spielgeschwindigkeit) mit dem napi-Modul aus
# spikes/1.4-tabellen (sim-bridge mit den Optionen aus 1.5) und electron-builder 26.16.1
# nach dem Muster von spike-build-1-4.yml, startet das fertige Programm auf jedem System
# mit einem einminütigen Langzeitlauf (Rauchtest) und stellt die Pakete als Artefakte bereit.
# Die eigentliche Messung läuft auf den Rechnern des Projektinhabers; die Runner haben keine
# Grafikkarte, ihre Bildraten sind nicht aussagekräftig. Spike-Werkzeug, kein Release.
#
# Kleine Testpakete wie 1.4 (freigegeben 2026-10-13): Windows ZIP, macOS DMG (arm64), Linux AppImage.
# macOS: Ad-hoc-Signatur (identity "-", hardenedRuntime false in package.json; ADR-015,
# Fahrplan 1.6-N1), damit macOS beim heruntergeladenen Paket „Dennoch öffnen" anbietet statt
# „beschädigt" zu melden. Keine Beglaubigung durch Apple (Signatur-Entscheidung in 7.1).
#
# Action-Versionen wie in ci.yml (geprüft am 2026-10-13).

name: Spike-Build 1.5

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/1.5-leistung/app/**"
      - "spikes/1.4-tabellen/sim-bridge/**"
      - "spikes/1.3-spielfeld/bridge-core/**"
      - "spikes/1.2-wegweiser/src/**"
      - ".github/workflows/spike-build-1-5.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "26.11.1"     # project-context.md Abschnitt 3
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Paket ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/1.4-tabellen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spikes/1.5-leistung/app/package-lock.json
      - run: rustup show   # Rust 1.98.1 aus rust-toolchain.toml des Spikes
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: spikes/1.4-tabellen

      - name: Tests des Kerns (fünf Etagen) und der Brücke
        if: matrix.platform == 'linux'
        run: |
          cargo test --release --locked --manifest-path ../1.2-wegweiser/Cargo.toml
          cargo test --release --locked --manifest-path ../1.3-spielfeld/Cargo.toml -p bridge-core

      - name: Natives Modul bauen (Linux, Windows)
        if: matrix.platform != 'mac'
        run: |
          cargo build --release --locked -p sim-bridge
          mkdir -p ../1.5-leistung/app/native
          if [ "${{ matrix.platform }}" = win ]; then
            cp target/release/sim_bridge.dll ../1.5-leistung/app/native/sim_bridge.node
          else
            cp target/release/libsim_bridge.so ../1.5-leistung/app/native/sim_bridge.node
          fi

      - name: Natives Modul bauen (macOS, Apple-Chips)
        if: matrix.platform == 'mac'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --locked -p sim-bridge --target aarch64-apple-darwin
          mkdir -p ../1.5-leistung/app/native
          cp target/aarch64-apple-darwin/release/libsim_bridge.dylib ../1.5-leistung/app/native/sim_bridge.node
          lipo -info ../1.5-leistung/app/native/sim_bridge.node

      - name: Paket bauen
        working-directory: spikes/1.5-leistung/app
        run: |
          npm ci --no-audit --no-fund
          npm run build:panel
          npx electron-builder --${{ matrix.platform }} --publish never

      # Rauchtest: Langzeitlauf von 1 Minute (10.000 Personen, 768 × 768 × 5 Etagen, 180 Ticks/s).
      # --enable-unsafe-swiftshader: WebGL ohne Grafikkarte (nur für die Runner).
      - name: Rauchtest Linux
        if: matrix.platform == 'linux'
        working-directory: spikes/1.5-leistung/app
        run: |
          exe=release/linux-unpacked/openairside-spike-1-5
          timeout 600 xvfb-run -a -s "-screen 0 1280x800x24" "$exe" --no-sandbox --enable-unsafe-swiftshader \
            --series=longrun --minutes=1 \
            --exit --out="$PWD/smoke.json" --screenshot="$PWD/smoke.png" > smoke.log 2>&1 || { tail -40 smoke.log; exit 1; }

      - name: Rauchtest Windows
        if: matrix.platform == 'win'
        working-directory: spikes/1.5-leistung/app
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/win-unpacked -Filter *.exe | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--enable-unsafe-swiftshader','--series=longrun','--minutes=1','--exit',"--out=$PWD\smoke.json","--screenshot=$PWD\smoke.png" -PassThru -Wait
          "Exit-Code: $($p.ExitCode)"

      - name: Signatur prüfen (macOS, ad hoc)
        if: matrix.platform == 'mac'
        working-directory: spikes/1.5-leistung/app
        run: |
          app="$(ls -d release/mac-arm64/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee codesign.txt
          grep -q "Signature=adhoc" codesign.txt
          codesign --verify --verbose=2 "$app/Contents/Resources/app/native/sim_bridge.node"

      - name: Rauchtest macOS
        if: matrix.platform == 'mac'
        working-directory: spikes/1.5-leistung/app
        run: |
          app="$(ls -d release/mac-arm64/*.app | head -1)"
          lipo -info "$app/Contents/MacOS/"*
          "$app/Contents/MacOS/$(basename "$app" .app)" --enable-unsafe-swiftshader \
            --series=longrun --minutes=1 \
            --exit --out="$PWD/smoke.json" --screenshot="$PWD/smoke.png"

      - name: Rauchtest auswerten
        working-directory: spikes/1.5-leistung/app
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("smoke.json", "utf8"));
            const run = r.runs[0];
            console.log(r.gpu, "| WebGL2:", r.webgl2, "| max Ticks/s", run.maxTicksPerSec);
            for (const w of run.windows) console.log(w.name, "fps", w.fps, "Ticks/s", w.ticksPerSec, "Rückstand", w.behindTicks, "Neuberechnungen", w.recomputes, w.recomputeMsMax, "ms", "Speicher", w.memTotalMb, "MB, Kern", w.memSimCoreMb, "MB");
            const ok = r.webgl2 && run.windows.length > 0 && run.windows.every((w) => w.fps > 0 && w.ticksPerSec > 0) && run.windows.some((w) => w.recomputes > 0) && run.windows.every((w) => w.memSimCoreMb > 0);
            if (!ok) process.exit(1);
          '

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: spike-1-5-${{ matrix.platform }}
          retention-days: 14
          path: |
            spikes/1.5-leistung/app/release/*.AppImage
            spikes/1.5-leistung/app/release/*.zip
            spikes/1.5-leistung/app/release/*.dmg
            spikes/1.5-leistung/app/smoke*
