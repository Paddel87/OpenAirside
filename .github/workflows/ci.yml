# CI für OpenAirside (Klasse G). Abgeleitet aus templates/github-workflows/ci-typescript.yml,
# ergänzt um Rust-Jobs (keine Rust-Vorlage vorhanden), eine Plattform-Matrix und den
# Electron-Rauchtest (ADR-018), seit Schritt 2.2 um Kern-Benchmark und Prüfung der erzeugten
# TypeScript-Typen (ADR-022), seit Schritt 2.3 um den Wegweiser-Benchmark (ADR-023), seit Schritt 3.1a um den Dauerbau-Benchmark (ADR-041), seit Q.5 mit Trigger nur für main und PRs
# und ohne Code-Jobs bei reinen Doku-Änderungen auf grünem Stand (ADR-043). Pflichtkategorien nach CLAUDE.md Abschnitt 15; Werte aus
# docs/project-context.md Abschnitt 7. Lokale Hooks (.pre-commit-config.yaml) führen dieselben
# Checks aus — diese Pipeline ist die unabhängige Diagnoseschicht, kein Ersatz.
# Änderungen an dieser Datei sind freigabepflichtig (CLAUDE.md 4.7).
#
# Action-Versionen geprüft am 2026-10-13 (Tags per git ls-remote, Mindestreife nach
# project-context.md Abschnitt 3): checkout v7.0.1, setup-node v7.0.0, setup-python v7.0.0,
# upload-artifact v7.0.1, Swatinem/rust-cache v2.9.2; pre-commit 4.6.2 (PyPI).

name: CI

on:
  # Feature-Branches laufen über ihren PR; ohne PR von Hand über „Run workflow“ (ADR-043).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "26.11.1" # project-context.md Abschnitt 3
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" # Warnungen sind Fehler (CLAUDE.md Abschnitt 15)

jobs:
  # Entscheidet, ob die Code-Jobs laufen: nicht bei reinen Doku-Änderungen (docs/, *.md) auf einem
  # Stand, dessen Checks alle bestanden haben (scripts/ci-changes.mjs, ADR-043). Übersprungene Jobs
  # zählen für die Pflicht-Checks des Rulesets „main-schutz“ als bestanden; die Matrix-Jobs
  # überspringen ihre Schritte statt des Jobs, damit sie unter ihrem vollen Namen melden. Die Code-Jobs
  # laufen, außer die Entscheidung lautet ausdrücklich `false`: scheitert dieser Job, laufen sie alle.
  changes:
    name: Änderungsart (Code oder nur Doku)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read # Checks des vorigen Commits
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  docs:
    name: Dokumentation (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      # pre-commit direkt statt pre-commit/action@v3.0.1: die Action nutzt intern actions/cache@v4
      # mit abgekündigtem Node 20 (CI-Protokoll vom 2026-10-13). pre-commit 4.6.2 (Linie 4.6 seit 2026-04).
      - run: pip install pre-commit==4.6.2
      - name: pre-commit (alle Dateien)
        env:
          # Code-Hooks laufen in den Jobs unten mit installierten Abhängigkeiten.
          SKIP: prettier,eslint,tsc,vitest-related,cargo-fmt,cargo-clippy
        run: pre-commit run --all-files --show-diff-on-failure

  # ---------- Rust-Simulationskern und Brücke ----------

  rust-lint:
    name: Rust Lint & Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install # installiert die Version aus rust-toolchain.toml (1.98.1), ADR-035
      - uses: Swatinem/rust-cache@v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # Eingecheckte TypeScript-Typen müssen den Rust-Typen entsprechen (ts-rs, ADR-021, ADR-022).
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Erzeugte Typen (app/src/generated) aktuell
        run: npm run check:types
      # Eingecheckte JSON-Schema-Dateien der Datenpakete müssen den Rust-Typen entsprechen (ADR-025).
      - name: Erzeugte Schemas (content/schema) aktuell
        run: npm run check:schema

  rust-bench:
    name: Kern-Benchmark
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # nur für den Vergleich mit dem letzten Lauf auf main (Anzeige, ADR-022, ADR-023)
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      # Rot bei Mittelwert > 1 ms oder p99 > 4 ms je Schritt mit 10.000 Personen (ADR-022).
      - name: Tick mit 10.000 Personen
        # cargo bench startet das Programm im Paketordner core/, daher ein absoluter Pfad.
        run: cargo bench -p openairside-core --bench tick --locked -- --output "$GITHUB_WORKSPACE/bench-tick.json"
      # Rot bei Neuberechnung > 4 s oder Schritt p99 > 4 ms im Referenz-Terminal 768² × 5 (ADR-023).
      # Läuft auch, wenn der Tick-Benchmark rot ist.
      - name: Wegweiser im Referenz-Terminal
        if: always()
        run: cargo bench -p openairside-core --bench flowfield --locked -- --output "$GITHUB_WORKSPACE/bench-flowfield.json"
      # Rot bei mehr als 8 s zwischen zwei Übernahmen neuer Wegweiser beim Dauerbau, mehr als 8 s von der
      # letzten Bauaktion bis zur Übernahme ihres Stands, mehr als 2 Neuberechnungen, 3 Feldsätzen oder
      # 2 Schnappschuss-Kopien gleichzeitig (ADR-041). Läuft auch, wenn ein früherer Schritt rot ist.
      - name: Dauerbau im Referenz-Terminal
        if: always()
        run: cargo bench -p openairside-core --bench continuous_build --locked -- --output "$GITHUB_WORKSPACE/bench-continuous-build.json"
      - name: Vergleichswert vom letzten Lauf auf main holen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            for name in bench-tick bench-flowfield bench-continuous-build; do
              gh run download "$run_id" --repo "${{ github.repository }}" --name "$name" --dir previous \
                || echo "Kein Ergebnis $name im Lauf $run_id"
            done
          else
            echo "Kein erfolgreicher Lauf auf main"
          fi
      - uses: actions/setup-node@v7.0.0
        if: always()
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Zusammenfassung mit Trend
        if: always()
        run: |
          node scripts/bench-report.mjs bench-tick.json previous/bench-tick.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/bench-report.mjs bench-flowfield.json previous/bench-flowfield.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/bench-report.mjs bench-continuous-build.json previous/bench-continuous-build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bench-tick
          path: bench-tick.json
          retention-days: 90
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bench-flowfield
          path: bench-flowfield.json
          retention-days: 90
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bench-continuous-build
          path: bench-continuous-build.json
          retention-days: 90

  rust-security:
    name: Rust Security & Audit (cargo-deny)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install --locked cargo-deny@0.20.2
      - name: cargo-deny (Advisories, Lizenzen, Herkunft)
        run: cargo deny check

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Reine Doku-Änderung auf grünem Stand: Schritte überspringen, Job meldet bestanden (ADR-043).
      - if: needs.changes.outputs.code == 'false'
        run: echo "Nur Dokumentation geändert, Code-Prüfung übersprungen (ADR-043)"
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code != 'false'
      - run: rustup toolchain install
        if: needs.changes.outputs.code != 'false'
      - uses: Swatinem/rust-cache@v2.9.2
        if: needs.changes.outputs.code != 'false'
      - run: cargo test --workspace --locked
        if: needs.changes.outputs.code != 'false'

  rust-coverage:
    name: Rust Coverage (Kern ≥ 85 %, gesamt ≥ 70 %)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install --locked cargo-llvm-cov@0.9.1
      # Die Brücke (bridge/, `test = false`) prüft der Electron-Rauchtest (ADR-018).
      - name: Coverage gesamt (≥ 70 %)
        run: cargo llvm-cov --workspace --locked --fail-under-lines 70 --lcov --output-path lcov-rust.info
      - name: Coverage Kern (≥ 85 %)
        run: cargo llvm-cov report --package openairside-core --fail-under-lines 85
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-rust
          path: lcov-rust.info
          retention-days: 14

  # ---------- TypeScript-Präsentation und Plattform ----------

  ts-lint:
    name: TS Lint & Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        # Obergrenze 0 laut Warnungs-Bestand (project-context.md Abschnitt 7).
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  ts-typecheck:
    name: TS Type-Check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ts-security:
    name: TS Dependency-Audit & Lizenzen
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high # Schwellenwert aus project-context.md Abschnitt 7
      - name: Lizenzen (project-context.md Abschnitt 6, ADR-019)
        run: npm run check:licenses

  ts-test:
    name: TS Tests & Coverage (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Reine Doku-Änderung auf grünem Stand: Schritte überspringen, Job meldet bestanden (ADR-043).
      - if: needs.changes.outputs.code == 'false'
        run: echo "Nur Dokumentation geändert, Code-Prüfung übersprungen (ADR-043)"
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-node@v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code != 'false'
      - name: Vitest mit Coverage
        if: needs.changes.outputs.code != 'false'
        # Mindestwert 70 % Lines in vitest.config.ts (coverage.thresholds), project-context.md Abschnitt 7.
        run: npm test
      - if: needs.changes.outputs.code != 'false' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-ts
          path: coverage/
          retention-days: 14

  # ---------- Gesamtsystem ----------

  e2e:
    name: Rauchtest Electron (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Reine Doku-Änderung auf grünem Stand: Schritte überspringen, Job meldet bestanden (ADR-043).
      - if: needs.changes.outputs.code == 'false'
        run: echo "Nur Dokumentation geändert, Code-Prüfung übersprungen (ADR-043)"
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-node@v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: rustup toolchain install
        if: needs.changes.outputs.code != 'false'
      - uses: Swatinem/rust-cache@v2.9.2
        if: needs.changes.outputs.code != 'false'
      - run: npm ci
        if: needs.changes.outputs.code != 'false'
      - run: npm run build
        if: needs.changes.outputs.code != 'false'
      - name: Playwright (Linux, virtueller Bildschirm)
        if: needs.changes.outputs.code != 'false' && runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Playwright
        if: needs.changes.outputs.code != 'false' && runner.os != 'Linux'
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          retention-days: 14
