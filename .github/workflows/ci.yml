# CI für OpenAirside (Klasse G). Abgeleitet aus templates/github-workflows/ci-typescript.yml,
# ergänzt um Rust-Jobs (keine Rust-Vorlage vorhanden), eine Plattform-Matrix und den
# Electron-Rauchtest (ADR-018). Pflichtkategorien nach CLAUDE.md Abschnitt 15; Werte aus
# docs/project-context.md Abschnitt 7. Lokale Hooks (.pre-commit-config.yaml) führen dieselben
# Checks aus — diese Pipeline ist die unabhängige Diagnoseschicht, kein Ersatz.
# Änderungen an dieser Datei sind freigabepflichtig (CLAUDE.md 4.7).
#
# Action-Versionen geprüft am 2026-10-13 (Tags per git ls-remote, Mindestreife nach
# project-context.md Abschnitt 3): checkout v7.0.1, setup-node v7.0.0, setup-python v7.0.0,
# upload-artifact v7.0.1, Swatinem/rust-cache v2.9.2; pre-commit 4.6.2 (PyPI).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "26.11.1" # project-context.md Abschnitt 3
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" # Warnungen sind Fehler (CLAUDE.md Abschnitt 15)

jobs:
  docs:
    name: Dokumentation (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      # pre-commit direkt statt pre-commit/action@v3.0.1: die Action nutzt intern actions/cache@v4
      # mit abgekündigtem Node 20 (CI-Protokoll vom 2026-10-13). pre-commit 4.6.2 (Linie 4.6 seit 2026-04).
      - run: pip install pre-commit==4.6.2
      - name: pre-commit (alle Dateien)
        env:
          # Code-Hooks laufen in den Jobs unten mit installierten Abhängigkeiten.
          SKIP: prettier,eslint,tsc,vitest-related,cargo-fmt,cargo-clippy
        run: pre-commit run --all-files --show-diff-on-failure

  # ---------- Rust-Simulationskern und Brücke ----------

  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show # installiert die Version aus rust-toolchain.toml (1.98.1)
      - uses: Swatinem/rust-cache@v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  rust-security:
    name: Rust Security & Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install --locked cargo-deny@0.20.2
      - name: cargo-deny (Advisories, Lizenzen, Herkunft)
        run: cargo deny check

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --workspace --locked

  rust-coverage:
    name: Rust Coverage (Kern ≥ 85 %, gesamt ≥ 70 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install --locked cargo-llvm-cov@0.9.1
      # Die Brücke (bridge/, `test = false`) prüft der Electron-Rauchtest (ADR-018).
      - name: Coverage gesamt (≥ 70 %)
        run: cargo llvm-cov --workspace --locked --fail-under-lines 70 --lcov --output-path lcov-rust.info
      - name: Coverage Kern (≥ 85 %)
        run: cargo llvm-cov report --package openairside-core --fail-under-lines 85
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-rust
          path: lcov-rust.info
          retention-days: 14

  # ---------- TypeScript-Präsentation und Plattform ----------

  ts-lint:
    name: TS Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        # Obergrenze 0 laut Warnungs-Bestand (project-context.md Abschnitt 7).
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  ts-typecheck:
    name: TS Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ts-security:
    name: TS Dependency-Audit & Lizenzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high # Schwellenwert aus project-context.md Abschnitt 7
      - name: Lizenzen (project-context.md Abschnitt 6, ADR-019)
        run: npm run check:licenses

  ts-test:
    name: TS Tests & Coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest mit Coverage
        # Mindestwert 70 % Lines in vitest.config.ts (coverage.thresholds), project-context.md Abschnitt 7.
        run: npm test
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-ts
          path: coverage/
          retention-days: 14

  # ---------- Gesamtsystem ----------

  e2e:
    name: Rauchtest Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
      - run: npm run build
      - name: Playwright (Linux, virtueller Bildschirm)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Playwright
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          retention-days: 14
