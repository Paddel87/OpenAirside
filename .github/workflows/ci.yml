# CI fuer Dev-Templates selbst (eingefuehrt mit S-5 und ADR-003, siehe docs/archiv/selbstanwendung/).
# Klasse K: ein Job, fuehrt denselben pre-commit-Hook aus wie lokal (.pre-commit-config.yaml,
# ADR-002). Zweite, unabhaengige Diagnoseschicht zusaetzlich zu den lokalen Hooks - ersetzt sie
# nicht. Aktionsversionen live gegen GitHub-Releases verifiziert (2026-08-13), nicht auf latest.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Markdown-Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
