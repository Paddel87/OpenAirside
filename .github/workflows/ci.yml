# CI für OpenAirside (Klasse G). Abgeleitet aus templates/github-workflows/ci-typescript.yml,
# ergänzt um Rust-Jobs (keine Rust-Vorlage vorhanden) und eine Plattform-Matrix.
# Pflichtkategorien nach CLAUDE.md Abschnitt 15; Werte aus docs/project-context.md Abschnitt 7.
# Lokale Hooks (.pre-commit-config.yaml) führen dieselben Checks aus — diese Pipeline ist die
# unabhängige Diagnoseschicht, kein Ersatz.
#
# Bis Fahrplan-Schritt 2.1 gibt es weder package.json noch Cargo.toml. Der Job „detect" prüft das;
# die Code-Jobs werden bis dahin übersprungen, die Dokumentations-Prüfung läuft immer.
#
# Action-Versionen geprüft am 2026-10-13 (Tags per git ls-remote, Mindestreife nach
# project-context.md Abschnitt 3): checkout v7.0.1, setup-node v7.0.0, setup-python v7.0.0,
# upload-artifact v7.0.1, pre-commit/action v3.0.1, Swatinem/rust-cache v2.9.2.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "26.11.1"     # project-context.md Abschnitt 3
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"    # Warnungen sind Fehler (CLAUDE.md Abschnitt 15)

jobs:
  docs:
    name: Dokumentation (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # Code-Hooks laufen in den Jobs unten mit installierten Abhängigkeiten.
          SKIP: prettier,eslint,tsc,vitest-related,cargo-fmt,cargo-clippy

  detect:
    name: Projektteile erkennen
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: check
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  # ---------- Rust-Simulationskern ----------

  rust-lint:
    name: Rust Lint & Format
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show   # installiert die Version aus rust-toolchain.toml (1.98.1)
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-security:
    name: Rust Security & Audit (cargo-deny)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install --locked cargo-deny@0.20.2
      - name: cargo-deny (Advisories, Lizenzen, Herkunft)
        run: cargo deny check

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --all --locked

  rust-coverage:
    name: Rust Coverage (Kern ≥ 85 %)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install --locked cargo-llvm-cov@0.9.1
      - name: Coverage mit Mindestwert
        run: cargo llvm-cov --all --locked --fail-under-lines 85 --lcov --output-path lcov-rust.info
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-rust
          path: lcov-rust.info
          retention-days: 14

  # ---------- TypeScript-Präsentation und Plattform ----------

  ts-lint:
    name: TS Lint & Format
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        # Obergrenze 0 laut Warnungs-Bestand (project-context.md Abschnitt 7).
        run: npx eslint . --max-warnings 0 --report-unused-disable-directives
      - name: Prettier check
        run: npx prettier --check .

  ts-typecheck:
    name: TS Type-Check
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  ts-security:
    name: TS Dependency-Audit
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high   # Schwellenwert aus project-context.md Abschnitt 7

  ts-test:
    name: TS Tests & Coverage (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.node == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest mit Coverage
        # Mindestwert 70 % Lines in vitest.config.ts (coverage.thresholds), project-context.md Abschnitt 7.
        run: npx vitest run --coverage
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-ts
          path: coverage/
          retention-days: 14
