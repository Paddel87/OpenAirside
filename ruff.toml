# ruff-Konfiguration für Dev-Templates selbst (S-24, ADR-017).
# Gilt für das einzige Python im Repo: das Hilfsskript unter templates/werkzeuge/ und seinen Test.
# Regelauswahl: Standardfehler (E, F, W), typische Fehlerquellen (B), zu breite Ausnahmen (BLE),
# Sicherheitsregeln aus bandit (S, deckt den Security-Scanner ab), veraltete Syntax für die
# Zielversion (UP) und ungenutzte Suppressions (RUF100, CLAUDE.md Abschnitt 15).
target-version = "py38"
line-length = 100

[lint]
select = ["E", "F", "W", "B", "BLE", "S", "UP", "RUF100"]
